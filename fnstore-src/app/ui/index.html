<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用商店</title>
<style>
:root{
  --bg:#f2f4f7; --panel:#fff; --bd:#e6e8eb; --tx:#1f2328; --tx2:#616a75; --tx3:#8b949e;
  --pri:#1a73e8; --pri-d:#1558b0; --pri-l:#e8f1fe;
  --ok:#1a7f37; --ok-l:#e6f4ea; --warn:#b45309; --warn-l:#fef3c7;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{display:flex;height:100vh;overflow:hidden}

/* ── 侧栏 ── */
.side{width:200px;background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;flex:0 0 auto}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.brand img{width:32px;height:32px;border-radius:8px}
.brand b{font-size:15px}
.brand span{display:block;font-size:11px;color:var(--tx3);font-weight:400}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-t{font-size:11px;color:var(--tx3);padding:8px 10px 4px;letter-spacing:.5px}
.nav-i{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  font-size:13.5px;color:var(--tx2);cursor:pointer;user-select:none;margin-bottom:1px}
.nav-i:hover{background:#f4f6f8;color:var(--tx)}
.nav-i.on{background:var(--pri-l);color:var(--pri-d);font-weight:600}
.nav-i .n{flex:1}
.nav-i .c{font-size:11px;background:#eef0f2;border-radius:10px;padding:1px 7px;color:var(--tx2)}
.nav-i.on .c{background:#fff}
.side-f{padding:10px 12px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--tx3)}

/* ── 主区 ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--panel);border-bottom:1px solid var(--bd);padding:12px 20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:650;margin-right:4px}
.search{flex:1;min-width:180px;max-width:420px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--bd);border-radius:8px;
  font-size:13.5px;font-family:inherit;background:#fbfbfc;outline:0}
.search input:focus{background:#fff;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.search svg{position:absolute;left:10px;top:8px;opacity:.4}
.btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--bd);
  background:#fff;color:var(--tx);transition:.15s;white-space:nowrap}
.btn:hover{border-color:#c8d0da;background:#fafbfc}
.btn-p{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn-p:hover{background:var(--pri-d);border-color:var(--pri-d);color:#fff}
.btn-s{padding:5px 12px;font-size:12.5px}
.content{flex:1;overflow-y:auto;padding:18px 20px 40px}

/* ── 卡片 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:14px;
  display:flex;gap:12px;box-shadow:var(--sh);transition:.15s;cursor:pointer;position:relative}
.card:hover{border-color:#c9d6ea;box-shadow:0 4px 14px rgba(16,24,40,.1)}
.ic{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#f7f8fa;
  border:1px solid #eef0f3;flex:0 0 auto;padding:3px}
.ci{flex:1;min-width:0}
.cn{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:4px;font-weight:600}
.tag-in{background:var(--ok-l);color:var(--ok)}
.tag-up{background:var(--warn-l);color:var(--warn)}
.cd{font-size:12.5px;color:var(--tx2);margin:5px 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--tx3)}
.cm .v{background:#f2f4f7;padding:1px 6px;border-radius:4px;color:var(--tx2);font-weight:600}
.cact{display:flex;gap:6px;margin-top:9px}
.empty{text-align:center;padding:70px 20px;color:var(--tx3)}
.empty div:first-child{font-size:40px;margin-bottom:10px;opacity:.3}
.srcbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--tx2);
  background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.err{background:#d1242f}
.dot.off{background:#c0c6cc}

/* ── 弹窗 ── */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:none;
  align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;max-height:86vh;
  overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mh{padding:20px 22px 16px;border-bottom:1px solid var(--bd);display:flex;gap:14px;align-items:flex-start}
.mh img{width:58px;height:58px;border-radius:13px;border:1px solid #eef0f3;padding:3px}
.mh h2{font-size:18px;font-weight:700}
.ms{font-size:12.5px;color:var(--tx2);margin-top:3px}
.x{margin-left:auto;font-size:24px;color:#a0a8b0;line-height:1;padding:0 2px}
.x:hover{color:var(--tx)}
.mb{padding:18px 22px 22px}
.shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.shots img{height:250px;border-radius:8px;border:1px solid var(--bd);flex:0 0 auto;background:#f7f8fa}
.st{font-size:12px;font-weight:650;color:var(--tx2);margin:16px 0 7px;letter-spacing:.4px}
.desc{font-size:13.5px;color:#404954}
.log{background:#f7f8fa;border:1px solid var(--bd);border-radius:8px;padding:12px 14px;
  font-size:12.5px;color:#404954;white-space:pre-wrap;max-height:200px;overflow-y:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px;color:var(--tx2)}
.kv b{color:var(--tx);font-weight:600}
.mf{display:flex;gap:8px;flex-wrap:wrap;padding-top:18px;margin-top:18px;border-top:1px solid var(--bd)}

/* ── 安装进度 ── */
.prog{position:fixed;right:20px;bottom:20px;z-index:120;width:300px;background:#fff;
  border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 28px rgba(16,24,40,.18);
  padding:14px 16px;display:none}
.prog.on{display:block}
.prog b{font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pbar{height:6px;background:#eef0f3;border-radius:3px;margin:10px 0 6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pri);width:0;transition:.3s;border-radius:3px}
.prog .st2{font-size:11.5px;color:var(--tx3);word-break:break-all;max-height:90px;overflow-y:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);
  background:#1f2328;color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;
  z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #d0d7de;border-top-color:var(--pri);
  border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:820px){
  .side{display:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="icon.png" alt="">
      <div><b>应用商店</b><span>fn 第三方应用</span></div>
    </div>
    <div class="nav">
      <div class="nav-t">应用</div>
      <div class="nav-i on" data-f="all"><span class="n">全部应用</span><span class="c" id="c-all">0</span></div>
      <div class="nav-i" data-f="installed"><span class="n">已安装</span><span class="c" id="c-in">0</span></div>
      <div class="nav-i" data-f="update"><span class="n">可更新</span><span class="c" id="c-up">0</span></div>
      <div class="nav-t">分类</div>
      <div id="cats"></div>
    </div>
    <div class="side-f">
      维护者 一起瞎折腾<br>
      <span id="ver"></span>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <h1 id="title">全部应用</h1>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" placeholder="搜索应用…" oninput="render()">
      </div>
      <button class="btn" onclick="load(true)">刷新</button>
      <button class="btn" id="pxbtn" onclick="toggleProxy()">加速：关</button>
      <button class="btn" onclick="srcMgr()">应用源</button>
    </div>

    <div class="content">
      <div class="srcbar" id="srcbar"></div>
      <div id="loading" style="text-align:center;padding:60px;color:#8b949e">
        <span class="spin"></span> 正在获取应用列表…
      </div>
      <div class="grid" id="grid" style="display:none"></div>
      <div class="empty" id="empty" style="display:none">
        <div>📦</div><div>没有找到应用</div>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeM()">
  <div class="modal" id="modal"></div>
</div>

<div class="prog" id="prog">
  <b><span id="p-name">安装中</span><span id="p-pct"></span></b>
  <div class="pbar"><i id="p-bar"></i></div>
  <div class="st2" id="p-log"></div>
</div>
<div class="toast" id="toast"></div>

<script src="main.js"></script>
</body>
</html>
